<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="icons/128.png" alt="" width="22" height="22">
      <span data-i18n="extName"></span>
    </div>
    <nav>
      <a href="#service" data-section="service">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h11M10 3l4 3-4 3M17 14H6M10 11l-4 3 4 3"/></svg>
        <span data-i18n="sectionService"></span>
      </a>
      <a href="#translation" data-section="translation">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h6.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 0-1.5-1.5H3zM17 4.5h-4.5A1.5 1.5 0 0 0 11 6v10a1.5 1.5 0 0 1 1.5-1.5H17z"/></svg>
        <span data-i18n="sectionTranslate"></span>
      </a>
      <a href="https://max1874.com/simple-translate/privacy" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l6 2.2v4.8c0 3.8-2.6 6.6-6 8-3.4-1.4-6-4.2-6-8V4.7z"/></svg>
        <span data-i18n="privacy"></span>
        <span class="external">↗</span>
      </a>
    </nav>
  </aside>

  <main>
    <section data-panel="service">
      <h1 data-i18n="sectionService"></h1>
      <p class="lead" data-i18n="serviceNote"></p>
      <div class="group" id="services" role="radiogroup"></div>

      <h2 id="service-name"></h2>
      <div class="group">
        <div class="row field-row" id="address-field">
          <div class="label"><label for="base-url" data-i18n="address"></label></div>
          <input id="base-url" class="field" type="url" spellcheck="false" placeholder="https://">
        </div>
        <div class="row field-row">
          <div class="label">
            <label for="api-key" data-i18n="apiKey"></label>
            <span class="sub" id="key-help"></span>
          </div>
          <span class="value" id="key-saved"></span>
          <input id="api-key" class="field" type="password" autocomplete="off" spellcheck="false">
          <span class="buttons" id="key-buttons">
            <button type="button" id="change-key" class="button" data-i18n="change"></button>
            <button type="button" id="remove-key" class="button"></button>
          </span>
        </div>
        <div class="row field-row">
          <div class="label">
            <label for="model" data-i18n="model"></label>
            <span class="sub" id="models-status"></span>
          </div>
          <span class="with-button">
            <input id="model" class="field" list="models" spellcheck="false">
            <datalist id="models"></datalist>
            <button type="button" id="refresh-models" class="icon" data-i18n-title="refresh">↻</button>
          </span>
        </div>
        <div class="row">
          <div class="label">
            <label for="reasoning" data-i18n="reasoning"></label>
            <span class="sub" data-i18n="reasoningHint"></span>
          </div>
          <span class="popup"><select id="reasoning"></select></span>
        </div>
      </div>
      <div class="below">
        <output id="test-result"></output>
        <span class="buttons">
          <a id="key-page" class="button" target="_blank" rel="noreferrer" data-i18n="getKey"></a>
          <button type="button" id="test" class="button primary" data-i18n="test"></button>
        </span>
      </div>
    </section>

    <section data-panel="translation" hidden>
      <h1 data-i18n="sectionTranslate"></h1>
      <div class="group">
        <div class="row">
          <div class="label"><label for="target-lang" data-i18n="targetLang"></label></div>
          <span class="popup"><select id="target-lang"></select></span>
        </div>
      </div>
      <p class="note" data-i18n="targetHint"></p>

      <h2 data-i18n="shortcut"></h2>
      <div class="group">
        <div class="row">
          <div class="label" data-i18n="actionTitle"></div>
          <kbd id="shortcut"></kbd>
          <button type="button" id="change-shortcut" class="button" data-i18n="change"></button>
        </div>
      </div>
      <p class="note" id="shortcut-hint" data-i18n="shortcutHint" hidden></p>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="icons.js"></script>
  <script src="options.js"></script>
</body>
</html>
