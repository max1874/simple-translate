<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/128.png" alt="" width="36" height="36">
      <div>
        <h1 data-i18n="extName"></h1>
        <p data-i18n="extDescription"></p>
      </div>
    </header>

    <section class="card">
      <h2 data-i18n="sectionService"></h2>
      <div class="tiles" id="services" role="radiogroup"></div>

      <div class="field">
        <div class="label">
          <label for="api-key" data-i18n="apiKey"></label>
          <span class="actions">
            <button type="button" id="remove-key" class="link danger"></button>
            <a id="key-page" target="_blank" rel="noreferrer" data-i18n="getKey"></a>
          </span>
        </div>
        <input id="api-key" type="password" autocomplete="off" spellcheck="false">
        <p class="hint" id="key-help"></p>
      </div>

      <div class="field" id="address-field">
        <div class="label"><label for="base-url" data-i18n="address"></label></div>
        <input id="base-url" type="url" spellcheck="false" placeholder="https://">
      </div>

      <div class="field">
        <div class="label"><label for="model" data-i18n="model"></label></div>
        <div class="with-button">
          <input id="model" list="models" spellcheck="false">
          <datalist id="models"></datalist>
          <button type="button" id="refresh-models" class="icon" data-i18n-title="refresh">↻</button>
        </div>
        <p class="hint" id="models-status"></p>
      </div>

      <div class="field">
        <div class="label"><span id="reasoning-label" data-i18n="reasoning"></span></div>
        <div class="segmented" id="reasoning" role="radiogroup" aria-labelledby="reasoning-label"></div>
      </div>

      <div class="test">
        <button type="button" id="test" class="primary" data-i18n="test"></button>
        <output id="test-result"></output>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionTranslate"></h2>
      <div class="field">
        <div class="label"><label for="target-lang" data-i18n="targetLang"></label></div>
        <select id="target-lang"></select>
        <p class="hint" data-i18n="targetHint"></p>
      </div>
      <div class="inline">
        <span data-i18n="shortcut"></span>
        <span class="actions">
          <kbd id="shortcut"></kbd>
          <button type="button" id="change-shortcut" data-i18n="shortcutChange"></button>
        </span>
      </div>
      <p class="hint" id="shortcut-hint" data-i18n="shortcutHint" hidden></p>
    </section>

    <footer>
      <p data-i18n="serviceNote"></p>
      <details>
        <summary data-i18n="advanced"></summary>
        <section class="card">
          <div class="field">
            <div class="label"><label for="extra-body" data-i18n="extraBody"></label></div>
            <textarea id="extra-body" rows="3" spellcheck="false" placeholder="{}"></textarea>
            <p class="hint" id="extra-body-note" data-i18n="extraBodyHint"></p>
          </div>
        </section>
      </details>
    </footer>
  </main>
  <script src="common.js"></script>
  <script src="icons.js"></script>
  <script src="options.js"></script>
</body>
</html>
