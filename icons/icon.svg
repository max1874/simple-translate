<!-- Source of icons/*.png. Drawn on a 16×16 grid so the toolbar size lands on whole pixels; 128.png has an 8 px margin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3748"/><stop offset="1" stop-color="#161B26"/></linearGradient></defs>
  <rect width="16" height="16" rx="3.6" fill="url(#g)"/>
  <rect x="3" y="3" width="10" height="2" rx="1" fill="#fff"/>
  <rect x="3" y="6" width="7" height="2" rx="1" fill="#fff" opacity=".55"/>
  <rect x="3" y="10" width="8" height="2" rx="1" fill="#F2B544"/>
</svg>
